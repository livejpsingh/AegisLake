name: CI - Continuous Integration

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-syntax-check:
    name: "Code Quality & Linting"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Linting Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Lint Python Codebase
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 src tests --count --select=E9,F63,F7,F82 --show-source --statistics
          # Warning level checks with exit-zero
          flake8 src tests --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics

  test-and-validate-pipeline:
    name: "Test Suite & Pipeline Run"
    runs-on: ubuntu-latest
    needs: [lint-and-syntax-check]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Project Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Automated Pytest Suite
        run: |
          pytest tests/ -v

      - name: Execute Full End-to-End Pipeline
        run: |
          python -m src.pipeline

      - name: Upload Risk Dashboard Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: risk-operations-dashboard
          path: |
            reports/risk_dashboard.html
            data/gold/feature_catalog.json
          retention-days: 14
